name: Release

# Tag pushes are the only automatic release trigger:
#   git tag -a v0.2.2 -m v0.2.2 && git push origin v0.2.2
# The tag publishes to npm and creates a GitHub Release whose notes are that
# version's CHANGELOG.md section. Branch pushes never publish on their own.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Avoid racing npm publishes and release creation, without interrupting a release already in progress.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure latest npm CLI for OIDC Trusted Publishing
        run: npm install -g --ignore-scripts npm@latest

      - name: Validate package and extension layout
        run: npm run check

      - name: Require the tag to match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $version."

      - name: Run tests
        run: npm test

      - name: Publish pi-kit if this version is new
        shell: bash
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          error_file="$RUNNER_TEMP/npm-view-error"

          if published_version="$(npm view "$package_name@$version" version --prefer-online 2>"$error_file")"; then
            if [[ "$published_version" != "$version" ]]; then
              echo "Unexpected npm registry response for $package_name@$version" >&2
              exit 1
            fi
            echo "Skipped $package_name@$version (already published on npm)."
            exit 0
          elif ! grep -q 'E404' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi

          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compose release notes from CHANGELOG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/changelog-section.mjs "$version" >"$notes"
          echo "Composed release notes for $version ($(wc -c <"$notes") bytes)."

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it untouched."
            exit 0
          fi

          flags=()
          if [[ "${tag#v}" == *-* ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            "${flags[@]}"
