name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - "kit.config.json"
      - "package.json"
      - "scripts/package.mjs"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Avoid racing npm publishes, without interrupting a release already in progress.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure latest npm CLI for OIDC Trusted Publishing
        run: npm install -g --ignore-scripts npm@latest

      - name: Generate manifest from kit.config.json
        run: npm run manifest

      - name: Validate manifest and extension layout
        run: npm run check

      - name: Publish all extensions and the kit
        run: npm run publish:ci -- all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
