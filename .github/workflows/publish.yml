name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "scripts/check-package.mjs"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Avoid racing npm publishes, without interrupting a release already in progress.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Ensure latest npm CLI for OIDC Trusted Publishing
        run: npm install -g --ignore-scripts npm@latest

      - name: Validate package and extension layout
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Publish pi-kit if this version is new
        shell: bash
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          error_file="$RUNNER_TEMP/npm-view-error"

          if published_version="$(npm view "$package_name@$version" version --prefer-online 2>"$error_file")"; then
            if [[ "$published_version" != "$version" ]]; then
              echo "Unexpected npm registry response for $package_name@$version" >&2
              exit 1
            fi
            echo "Skipped $package_name@$version (already published on npm)."
            exit 0
          elif ! grep -q 'E404' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi

          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
